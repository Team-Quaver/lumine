# Lumine example configuration.
#
# Install as $XDG_CONFIG_HOME/lumine-wm/config.conf
# (usually ~/.config/lumine-wm/config.conf). The file is INI-like: ";" and "#"
# start a comment, keys are case-insensitive, and values may be quoted.
#
# The file is watched with inotify: saving it re-applies the new values live
# (layout, colour and the environment). exec-once lines are not re-run.

# -- Displays ----------------------------------------------------------------
# One section per output. With more than one screen use [Display-1],
# [Display-2], ... The earlier a section appears the higher its priority, and
# the highest-priority one is the main output unless main-monitor says
# otherwise.
[Display]
monitor          = eDP-1       ; connector / output name; empty = backend default
resolution       = 2560x1440   ; WIDTHxHEIGHT; "auto" keeps the backend size
refresh-Rate     = highest     ; "highest"/"auto" or a number such as 144
color-managment  = icc         ; icc | edid | none
icc-file         = ""          ; path to the .icc profile (used when icc)
main-monitor     = ""          ; true marks this section as the main output
hdr              = false       ; true switches the output to PQ / BT.2020
triple-buffering = true        ; DRM: allocate a third scanout buffer

# [Display-1]
# monitor          = HDMI-A-1
# resolution       = 3840x2160
# refresh-Rate     = 59.94
# color-managment  = edid
# triple-buffering = false

# -- Autostart ---------------------------------------------------------------
# Each exec-once line is launched once, after the compositor is listening.
# Repeating the key is what makes it a list.
[auto-start]
exec-once = fcitx5 -d
exec-once = /usr/bin/fastfetch

# -- Environment -------------------------------------------------------------
# Exported into the compositor's environment, so autostart commands, the
# terminal shortcut and every spawned client inherit it.
[wm-environment]
GTK_THEME       = Breeze
QT_SCALE_FACTOR = 1.25

# -- Key bindings ------------------------------------------------------------
# Merged with the built-in defaults: list only the keys you want to change.
# Reserved section; the full binding language lands in a later iteration.
[keybinding]
"super+t" = "mode-toggle"

# -- Compositor tuning (optional; defaults shown) ----------------------------
[layout]
mode         = tile   ; "tile" | "stack"
gap          = 8
column-ratio = 0.5

[input]
xkb-layout = us

[input.repeat]
delay = 300
rate  = 25

[color]
enabled   = true      ; expose wp_color_manager_v1
transfer  = srgb      ; "srgb" | "pq" | "hlg" | "linear"
primaries = srgb      ; "srgb" | "bt2020" | "dci-p3"
max-luma  = 400       ; nits

[decor]
mode = auto           ; "auto" | "ssd" | "csd"
